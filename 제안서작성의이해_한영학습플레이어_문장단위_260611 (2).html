{"t": "h", "ko": "4. 사업관리", "en": "4. Project Management"},
{"t": "s", "ko": "네 번째는 사업관리입니다.", "en": "The fourth part is project management."},
{"t": "s", "ko": "시스템 구축 절차를 제시했다면, 이제 그 과정을 어떻게 관리하고 통제할 것인지 설명해야 합니다.", "en": "After presenting the system implementation process, we must now explain how we will manage and control that process."},
{"t": "s", "ko": "사업관리는 성공적인 준공과 운영성과 검증까지 이끌기 위한 관리체계입니다.", "en": "Project management is the management system that leads the project to successful completion and operational performance verification."},
{"t": "s", "ko": "PMBOK 기준으로 통합, 범위, 비용, 일정, 품질, 자원, 구매, 의사소통, 이해관계자, 위험관리의 10개 관리영역과 착수, 계획, 실행, 종료의 4개 프로세스를 사업 특성에 맞게 조정(테일러링)하여 적용합니다.", "en": "Based on PMBOK, we tailor and apply ten management areas — integration, scope, cost, schedule, quality, resource, procurement, communication, stakeholder, and risk management — and four processes — initiation, planning, execution, and closing — to the characteristics of the project."},
{"t": "s", "ko": "이 중 범위, 비용, 일정, 품질, 자원은 가장 기본적인 관리영역입니다.", "en": "Among these, scope, cost, schedule, quality, and resource are the most basic management areas."},
{"t": "h", "ko": "착수와 종료", "en": "Initiation and Closing"},
{"t": "s", "ko": "특히 착수 단계에서는 프로젝트 차터, 즉 사업 수행의 헌법을 만들어야 합니다.", "en": "In particular, the initiation stage must create the project charter, which is like the constitution of the project."},
{"t": "s", "ko": "여기에는 과거 유사사업 분석, 수행 원칙, 보유 역량 검토, 사업 목적과 기준이 포함됩니다.", "en": "It includes analysis of similar past projects, execution principles, review of our capabilities, and the project purpose and criteria."},
{"t": "s", "ko": "종료 단계는 단순히 잔금을 받고 종료보고서를 내는 절차가 아닙니다.", "en": "The closing stage is not just a procedure of receiving the final payment and submitting the final report."},
{"t": "s", "ko": "수행 과정에서 잘한 점, 부족한 점, 다음 사업에서 개선할 점을 정리하는 메타지식 축적 단계입니다.", "en": "It is a stage for accumulating meta-knowledge by organizing what went well, what was insufficient, and what should be improved in the next project."},
{"t": "h", "ko": "5. 사업수행계획", "en": "5. Project Execution Plan"},
{"t": "s", "ko": "다섯 번째는 사업수행계획입니다.", "en": "The fifth part is the project execution plan."},
{"t": "s", "ko": "사업수행계획은 시스템구축에서 정의한 Work Package를 기준으로 실제 수행 가능한 계획을 만드는 장입니다.", "en": "The execution plan is the section that turns the Work Packages defined in system implementation into an actually executable plan."},
{"t": "s", "ko": "WBS가 “무엇을 할 것인가”를 보여준다면, 사업수행계획은 “누가, 언제, 어떤 자원으로, 어떤 산출물을 만들 것인가”를 보여줍니다.", "en": "If the WBS shows “what to do,” the execution plan shows “who will do it, when, with what resources, and what deliverables will be produced.”"},
{"t": "h", "ko": "사업수행계획 보완", "en": "Execution Plan in Detail"},
{"t": "s", "ko": "여기서 핵심 리소스는 사람입니다.", "en": "The most important resource here is people."},
{"t": "s", "ko": "역량 장에서 말하는 인력은 “우리가 이런 역량을 보유하고 있다”는 추상적 인력입니다.", "en": "The people in the competency section are abstract: “we have these human resources.”"},
{"t": "s", "ko": "그러나 사업수행계획의 인력은 실제로 이 사업에 투입 가능한 Assign된 인력입니다.", "en": "However, the people in the execution plan are assigned personnel who can actually be engaged in this project."},
{"t": "s", "ko": "즉, 사업수행계획은 일정표만 만드는 것이 아니라 실제 투입 인력, 역할, 조직, 교육계획, 산출물을 세팅하는 단계입니다.", "en": "In other words, the execution plan is not just a schedule table; it is the stage that sets up actual assigned personnel, roles, organization, training plans, and deliverables."},
{"t": "s", "ko": "특히 IT서비스 사업에서는 누가 실제로 투입될 수 있는지, 부족한 역량은 어떻게 교육으로 보완할지까지 보여주는 것이 중요합니다.", "en": "In IT service projects especially, it is important to show who can actually be assigned and how any missing capability will be supplemented through training."},
{"t": "h", "ko": "6. Change Management", "en": "6. Change Management"},
{"t": "s", "ko": "여섯 번째는 Change Management, 변화관리입니다.", "en": "The sixth part is Change Management."},
{"t": "s", "ko": "변화관리는 단순한 사용자 교육이 아닙니다.", "en": "Change Management is not simple user training."},
{"t": "s", "ko": "목표시스템이 구축되어도 고객의 일하는 방식이 바뀌지 않으면 다시 기존 방식으로 돌아갑니다.", "en": "Even if the target system is built, if the customer’s way of working does not change, people will return to the old way."},
{"t": "s", "ko": "따라서 변화관리는 운영자와 관리자, 의사결정자가 목표시스템을 이해하고, 실제 화면과 데이터를 다루며, 업무 판단 기준을 데이터 기반으로 전환하도록 지원하는 고객 Mindset 전환계획입니다.", "en": "Therefore, Change Management is a customer mindset transition plan that helps operators, managers, and decision makers understand the target system, use real screens and data, and shift their work judgment criteria to a data-based approach."},
{"t": "h", "ko": "Skill·Knowledge·Attitude와 Mindset", "en": "Skill, Knowledge, Attitude, and Mindset"},
{"t": "s", "ko": "변화관리는 Skill, Knowledge, Attitude가 단계적으로 쌓여 Mindset과 Growth로 이어지도록 설계해야 합니다.", "en": "Change Management should be designed so that Skill, Knowledge, and Attitude accumulate step by step and lead to Mindset and Growth."},
{"t": "s", "ko": "Skill은 실제 화면과 데이터를 다루는 능력입니다.", "en": "Skill is the ability to use actual screens and data."},
{"t": "s", "ko": "Skill이 반복되면 Knowledge, 즉 목표시스템과 업무원리에 대한 이해로 일반화됩니다.", "en": "When Skill is repeated, it generalizes into Knowledge, which means understanding the target system and the principles of work."},
{"t": "s", "ko": "그다음 Attitude, 즉 데이터를 보고 판단하려는 태도가 형성됩니다.", "en": "Then Attitude is formed, which means the willingness to judge based on data."},
{"t": "s", "ko": "이 과정이 쌓이면 운영자는 시스템을 참고용이 아니라 업무 판단 기준으로 받아들이는 Target Mindset을 갖게 되고, 최종적으로는 스스로 문제를 찾고 개선하는 Growth 단계로 발전합니다.", "en": "As this process accumulates, the operator develops the Target Mindset — accepting the system not as a reference tool but as the standard for work judgment — and finally grows into the Growth stage, finding and improving problems on their own."},
{"t": "h", "ko": "변화관리 핵심", "en": "The Core of Change Management"},
{"t": "s", "ko": "결국 변화관리는 사용법을 알려주는 교육이 아니라 고객의 Baseline Mindset을 Target Mindset으로 바꾸는 과정입니다.", "en": "In the end, Change Management is not training that explains how to use the system; it is the process of changing the customer’s Baseline Mindset into the Target Mindset."},
{"t": "s", "ko": "인프라가 바뀌고, 소프트웨어가 바뀌고, 업무체계가 바뀌는 각 전환 지점마다 고객의 Mindset도 함께 전환되어야 합니다.", "en": "At each transition point — when the infrastructure changes, the software changes, and the business process changes — the customer’s mindset must also change."},
{"t": "h", "ko": "Capability Define과 Assessment", "en": "Capability Definition and Assessment"},
{"t": "s", "ko": "변화관리는 먼저 Target Capability, 즉 목표시스템을 원활히 운영하기 위해 필요한 목표 역량 수준을 정의해야 합니다.", "en": "Change Management must first define the Target Capability, the target level of capability required to operate the target system smoothly."},
{"t": "s", "ko": "그다음 현재 운영자의 Skill, Knowledge, Attitude 수준을 Assessment하여 현재 역량을 진단합니다.", "en": "Next, the current levels of the operators’ Skill, Knowledge, and Attitude are assessed to diagnose the current capability."},
{"t": "s", "ko": "이후 목표 역량과 현재 역량의 차이, 즉 Gap을 확인하고, 인프라·정보·업무 전환 단계별로 필요한 교육과 현장 적용을 수행해야 합니다.", "en": "After that, the gap between the target capability and the current capability is identified, and the necessary training and on-site application are carried out at each transition stage of infrastructure, information, and business process."},
{"t": "s", "ko": "예를 들어 목표 운영 수준을 70점으로 정했는데 현재 Skill은 30점, Knowledge는 20점, Attitude는 10점이라면, 단계별 교육과 현장 적용을 통해 목표 수준까지 끌어올려야 합니다.", "en": "For example, if the target operation level is set at 70 points but the current Skill is 30, Knowledge is 20, and Attitude is 10, they must be raised to the target level through step-by-step training and on-site application."},
{"t": "s", "ko": "따라서 변화관리는 단순 교육계획이 아니라, Target Capability 정의 → 현재 Capability 진단 → Gap 확인 → 단계별 교육·현장적용 → Target Mindset 도달의 순서로 설계해야 합니다.", "en": "Therefore, Change Management is not a simple training plan; it must be designed in this order: define the Target Capability, assess the current capability, identify the gap, carry out step-by-step training and on-site application, and reach the Target Mindset."},
{"t": "h", "ko": "7. Operation", "en": "7. Operation"},
{"t": "s", "ko": "일곱 번째는 Operation, 운영관리입니다.", "en": "The seventh part is Operation, or operational management."},
{"t": "s", "ko": "운영관리는 단순한 유지보수나 백업·복구 계획이 아닙니다.", "en": "Operation is not just a maintenance, backup, or recovery plan."},
{"t": "s", "ko": "운영관리는 목표시스템이 실제로 쓰이고 있는지, 제대로 작동하는지, 기대효과가 실제로 나타나는지를 검증하는 단계입니다.", "en": "Operation is the stage that verifies whether the target system is actually being used, whether it works properly, and whether the expected benefits are actually appearing."},
{"t": "h", "ko": "운영관리의 순서", "en": "The Order of Operation"},
{"t": "s", "ko": "운영관리에서 가장 먼저 볼 것은 서비스 모니터링입니다.", "en": "The first thing to check in Operation is service monitoring."},
{"t": "s", "ko": "즉, 고객이 목표시스템을 실제로 잘 쓰고 있는지를 확인해야 합니다.", "en": "In other words, we must confirm whether the customer is actually using the target system well."},
{"t": "s", "ko": "만약 잘 쓰지 않고 있다면 기대효과를 먼저 보면 안 됩니다.", "en": "If the system is not being used well, we should not look at the expected benefits first."},
{"t": "s", "ko": "먼저 시스템 기능이 제대로 작동하는지, 사용자가 충분히 쓸 수 있는 Skill과 Mindset을 갖추었는지 확인해야 합니다.", "en": "We must first check whether the system functions are working properly and whether the users have enough Skill and Mindset to use it."},
{"t": "s", "ko": "문제가 있으면 소프트웨어를 더 쓰기 쉽게 개선하거나 추가 교육과 변화관리를 다시 수행해야 합니다.", "en": "If there is a problem, we must make the software easier to use or perform additional training and Change Management again."},
{"t": "h", "ko": "기대효과 검증", "en": "Verifying the Expected Benefits"},
{"t": "s", "ko": "고객이 목표시스템을 잘 쓰고 있을 때 비로소 기대효과를 검증할 수 있습니다.", "en": "Only when the customer is using the target system properly can we verify the expected benefits."},
{"t": "s", "ko": "기대효과는 업무효율성 향상, 예산절감, 신뢰도 향상의 3대 축으로 정리하고, 각 축별 지표, 데이터, 점검주기를 설정해야 합니다.", "en": "The expected benefits are organized into three axes — improved work efficiency, budget savings, and improved reliability — and for each axis, indicators, data, and inspection cycles must be defined."},
{"t": "s", "ko": "기대효과가 검증되면 그 Value Map과 목표시스템 체계는 다음 사업에 재사용할 수 있는 Asset이 됩니다.", "en": "If the expected benefits are verified, the Value Map and the target system structure become an asset that can be reused in the next project."},
{"t": "s", "ko": "기대효과가 부족하다면 왜 부족한지 다시 분석하고 개선사항을 운영기준과 시스템 개선에 반영해야 합니다.", "en": "If the expected benefits are insufficient, we must analyze why and reflect the improvements in the operation standards and system improvements."},
{"t": "h", "ko": "기대효과 검증의 선행조건", "en": "Preconditions for Benefit Verification"},
{"t": "s", "ko": "기대효과를 검증하기 전에 먼저 4가지 조건을 확인해야 합니다.", "en": "Before verifying the expected benefits, four conditions must be confirmed."},
{"t": "s", "ko": "첫째, 서버·네트워크·장비 등 인프라가 정상이어야 합니다.", "en": "First, the infrastructure — servers, networks, and equipment — must be working normally."},
{"t": "s", "ko": "둘째, 시스템 기능과 프로그램 등 소프트웨어가 정상이어야 합니다.", "en": "Second, the software, including system functions and programs, must be working normally."},
{"t": "s", "ko": "셋째, 운영 절차와 업무 프로세스가 실제 업무에서 유지되어야 합니다.", "en": "Third, the operation procedures and business processes must be maintained in actual work."},
{"t": "s", "ko": "넷째, 운영자·관리자·의사결정자가 목표시스템을 실제로 사용해야 합니다.", "en": "Fourth, the operators, managers, and decision makers must actually be using the target system."},
{"t": "s", "ko": "이 4가지 조건이 충족되지 않으면 기대효과 검증으로 넘어가면 안 됩니다.", "en": "If these four conditions are not met, we must not move on to benefit verification."},
{"t": "s", "ko": "먼저 기능 보완, 데이터 보정, 재교육, 변화관리, 업무기준 개선을 통해 목표시스템이 실제로 쓰일 수 있는 상태를 만들어야 합니다.", "en": "We must first bring the target system to a usable state through function improvement, data correction, retraining, Change Management, and improvement of work standards."},
{"t": "h", "ko": "3년 관점 기대효과 검증", "en": "Three-Year Benefit Verification"},
{"t": "s", "ko": "기대효과는 즉시 한 번에 나타나는 것이 아니라 일정 기간 관찰해야 합니다.", "en": "The expected benefits do not appear all at once; they must be observed over a period of time."},
{"t": "s", "ko": "운영관리는 대략 3년 관점에서 단계별로 검증하는 것이 좋습니다.", "en": "Operation should verify them step by step from roughly a three-year perspective."},
{"t": "s", "ko": "1단계는 업무효율성 향상입니다.", "en": "Stage one is improved work efficiency."},
{"t": "s", "ko": "시스템을 잘 쓰기 시작하면 보고시간 단축, 수작업 감소, 대응속도 개선이 먼저 나타납니다.", "en": "When the system starts to be used well, shorter reporting time, less manual work, and faster response appear first."},
{"t": "s", "ko": "2단계는 예산절감입니다.", "en": "Stage two is budget savings."},
{"t": "s", "ko": "업무효율성이 누적되면 장애 대응비, 복구비, 운영비, 불필요한 반복업무 비용이 줄어듭니다.", "en": "As work efficiency accumulates, the costs of incident response, recovery, operation, and unnecessary repetitive work decrease."},
{"t": "s", "ko": "3단계는 신뢰도 향상입니다.", "en": "Stage three is improved reliability."},
{"t": "s", "ko": "업무효율과 예산절감이 확인되면 데이터와 시스템 기반의 의사결정 신뢰도, 내부 보고 신뢰도, 고객 신뢰도가 높아집니다.", "en": "When work efficiency and budget savings are confirmed, the reliability of data-based and system-based decision making, internal reporting, and customer trust all increase."},
{"t": "s", "ko": "따라서 기대효과는 업무효율성 → 예산절감 → 신뢰도 향상 순서로 나타난다고 설명하고, 각 단계별로 지표, 데이터, 점검주기를 설정해야 합니다.", "en": "Therefore, we explain that the expected benefits appear in this order — work efficiency, then budget savings, then improved reliability — and define indicators, data, and inspection cycles for each stage."},
{"t": "h", "ko": "운영성과의 Asset 및 솔루션화", "en": "Turning Operational Results into Assets and Solutions"},
{"t": "s", "ko": "운영성과 검증 결과는 단순 보고서로 끝나면 안 됩니다.", "en": "The results of operational performance verification must not end as a simple report."},
{"t": "s", "ko": "목표시스템을 구축하고 운영하면서 실제 효과가 나타나는 인과관계를 관찰해야 합니다.", "en": "While building and operating the target system, we must observe the cause-and-effect relationships through which the actual benefits appear."},
{"t": "s", "ko": "이 인과관계를 반복적으로 분석하면 회사의 Asset이 됩니다.", "en": "When these cause-and-effect relationships are analyzed repeatedly, they become a company asset."},
{"t": "s", "ko": "특히 동일한 유형의 인과관계 모델을 3회 이상 분석하면 정확한 인과관계 맵을 만들 수 있고, 이는 향후 유사사업에 재사용 가능한 솔루션으로 발전할 수 있습니다.", "en": "In particular, if the same type of cause-and-effect model is analyzed three or more times, an accurate cause-and-effect map can be created, and it can develop into a solution that can be reused in similar future projects."},
{"t": "s", "ko": "즉, 운영관리는 기대효과 검증을 넘어 1차 솔루션, 2차 솔루션, 3차 솔루션으로 고도화되는 회사 자산 축적 단계입니다.", "en": "In other words, Operation goes beyond benefit verification; it is a stage of accumulating company assets, advancing from a first solution to a second and then a third solution."},
{"t": "h", "ko": "결론", "en": "Conclusion"},

function toSpeechEn(t){
  return t.split('AS-IS').join('as is').split('TO-BE').join('to be')
          .split('WBS').join('W B S').split('PMBOK').join('pim bok')
          .split('→').join(', then ');
}
const phoneticKo = [
  ["Change Management","체인지 매니지먼트"],["Target Capability","타깃 케이퍼빌리티"],
  ["Work Package","워크 패키지"],["Value Map","밸류 맵"],["Competency","컴피턴시"],
  ["Capability","케이퍼빌리티"],["Operation","오퍼레이션"],["Assessment","어세스먼트"],
  ["Baseline","베이스라인"],["Mindset","마인드셋"],["Knowledge","날리지"],
  ["Attitude","애티튜드"],["Target","타깃"],["Growth","그로스"],["Skill","스킬"],
  ["Assign","어사인"],["Asset","애셋"],["AS-IS","애즈 이즈"],["TO-BE","투 비"],
  ["WBS","더블유 비 에스"],["PMBOK","핌복"],["Gap","갭"],["GS","지에스"],
  ["IT","아이티"],["IP","아이피"],["→",", 그 다음 "],["+"," 그리고 "]
];
function toSpeechKo(t){ let s=t; for(const [a,b] of phoneticKo) s=s.split(a).join(b); return s; }

// 렌더링
const docEl=document.getElementById('doc'); const els=[];
pairs.forEach((b,i)=>{
  if(b.t==='h'){
    const h=document.createElement('h2');
    h.textContent=b.ko;
    const e=document.createElement('span'); e.className='en-h'; e.textContent=b.en;
    h.appendChild(e); docEl.appendChild(h); els.push(null);
  }else{
    const d=document.createElement('div'); d.className='pair';
    const k=document.createElement('div'); k.className='ko'; k.textContent=b.ko;
    const e=document.createElement('div'); e.className='en'; e.textContent=b.en;
    d.appendChild(k); d.appendChild(e);
    d.onclick=()=>startFrom(i);
    docEl.appendChild(d); els.push({d,k,e});
  }
});

const synth=window.speechSynthesis;
let idx=0, playing=false, session=0, enV=[], koV=[];
const playBtn=document.getElementById('playBtn'), status=document.getElementById('status');
const modeSel=document.getElementById('mode'), rateSel=document.getElementById('rate');
const vEnSel=document.getElementById('voiceEn'), vKoSel=document.getElementById('voiceKo');
const prog=document.getElementById('prog');

function fill(sel, list, label){
  const prev=sel.value;
  sel.innerHTML='';
  list.forEach((v,i)=>{const o=document.createElement('option');o.value=i;
    o.textContent=label+': '+v.name.replace('Microsoft ','').replace(/ Online \(Natural\).*/,' (자연음성)');
    sel.appendChild(o);});
  if(!list.length){const o=document.createElement('option');o.textContent=label+' 음성 없음';sel.appendChild(o);}
  if(prev && prev<list.length) sel.value=prev;
}
function loadVoices(){
  const all=synth.getVoices();
  const score=v=>{const n=v.name.toLowerCase();
    if(n.includes('natural')||n.includes('online')) return 0;
    if(n.includes('google')) return 1; return 2;};
  enV=all.filter(v=>v.lang.toLowerCase().startsWith('en')).sort((a,b)=>score(a)-score(b));
  koV=all.filter(v=>v.lang.toLowerCase().startsWith('ko')).sort((a,b)=>score(a)-score(b));
  fill(vEnSel,enV,'EN'); fill(vKoSel,koV,'KO');
}
loadVoices();
if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;

function mark(i, lang){
  document.querySelectorAll('.pair.now').forEach(e=>e.classList.remove('now'));
  document.querySelectorAll('.lang-now').forEach(e=>e.classList.remove('lang-now'));
  const el=els[i];
  if(el){
    el.d.classList.add('now');
    if(lang==='ko') el.k.classList.add('lang-now');
    if(lang==='en') el.e.classList.add('lang-now');
    el.d.scrollIntoView({block:'center',behavior:'smooth'});
  }
  prog.style.width=(100*i/pairs.length)+'%';
}


// ── 절전 대응: 재생 중 화면 꺼짐 방지 + 끊김 자동 복구 ──
let wakeLock=null, lastBeat=Date.now();
async function lockScreen(){
  try{ if('wakeLock' in navigator && !wakeLock){
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{wakeLock=null;});
  }}catch(e){}
}
function unlockScreen(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && playing){
    lockScreen();
    if(!synth.speaking && !synth.pending) startFrom(idx);  // 화면 복귀 시 멈춰 있으면 현재 문장부터 재개
  }
});
setInterval(()=>{
  if(!playing) return;
  try{ synth.resume(); }catch(e){}
  if(!synth.speaking && !synth.pending && Date.now()-lastBeat>8000) startFrom(idx);  // 8초 이상 무음이면 재개
},4000);

// 한 문장을 말하고, 끝나면 next() 호출. 세션이 바뀌면(클릭/모드변경/정지) 콜백 무효화.
function speakOne(i, lang, text, next){
  const my=session;
  const u=new SpeechSynthesisUtterance(text);
  u.rate=parseFloat(rateSel.value);
  if(lang==='ko'){ u.lang='ko-KR'; if(koV.length) u.voice=koV[vKoSel.value||0]; }
  else{ u.lang='en-US'; if(enV.length) u.voice=enV[vEnSel.value||0]; }
  let done=false;
  const finish=()=>{ if(done) return; done=true; lastBeat=Date.now();
    if(my!==session || !playing) return;   // 취소된 이전 세션의 유령 콜백 차단
    next(); };
  u.onstart=()=>{ lastBeat=Date.now(); if(my===session && playing) mark(i,lang); }; // 실제 발화 시작 시점에 하이라이트
  u.onend=finish; u.onerror=finish;
  mark(i,lang);
  synth.speak(u);
}

function speakNext(){
  if(!playing) return;
  while(idx<pairs.length && pairs[idx].t==='h') idx++;
  if(idx>=pairs.length){ stopAll('낭독 완료'); prog.style.width='100%'; return; }
  const b=pairs[idx], m=modeSel.value, i=idx;
  const advance=()=>{ idx=i+1; speakNext(); };
  if(m==='en'){
    speakOne(i,'en',toSpeechEn(b.en),advance);
  }else if(m==='ko'){
    speakOne(i,'ko',toSpeechKo(b.ko),advance);
  }else if(m==='enko'){
    speakOne(i,'en',toSpeechEn(b.en),()=>speakOne(i,'ko',toSpeechKo(b.ko),advance));
  }else{ // koen
    speakOne(i,'ko',toSpeechKo(b.ko),()=>speakOne(i,'en',toSpeechEn(b.en),advance));
  }
}
function startFrom(i){
  session++;            // 이전 발화의 콜백 무효화
  synth.cancel();
  idx=i; playing=true; lastBeat=Date.now(); lockScreen();
  playBtn.textContent='⏸ 일시정지'; status.textContent='재생 중';
  setTimeout(speakNext, 60);   // cancel 직후 speak가 무시되는 브라우저 이슈 회피
}
function stopAll(msg){
  session++;
  playing=false; synth.cancel(); unlockScreen();
  playBtn.textContent='▶ 재생'; status.textContent=msg||'일시정지됨';
}

playBtn.onclick=()=>{ playing ? stopAll() : startFrom(idx); };
document.getElementById('restartBtn').onclick=()=>startFrom(0);
[modeSel,rateSel,vEnSel,vKoSel].forEach(s=>s.onchange=()=>{ if(playing){ startFrom(idx); } });
window.addEventListener('beforeunload',()=>{ session++; synth.cancel(); });
</script>
